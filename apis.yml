name: Setpointmedical
description: 'SetPoint Medical is a bioelectronic medicine company developing an FDA-approved
  implantable neuroimmune modulation platform. The SetPoint System is a small, wireless,
  implantable device that stimulates the vagus nerve to reduce inflammation, delivering
  an automatic one-minute daily therapy for up to ten years to treat adults with moderate-to-severe
  rheumatoid arthritis who have not responded well to biologics. The company is backed by
  Norwest Venture Partners. It is a medical-device company with no public API or developer
  surface; this profile captures its identity and the security/disclosure posture surfaced
  by the enrichment pipeline.'
